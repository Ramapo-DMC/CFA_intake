<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unsubscribed &ndash; Center for Food Action</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: #f4f6f8;
      color: #1e2933;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      background: #fff;
      border: 1px solid #d7dee4;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(20,40,60,0.08);
      padding: 40px 44px;
      max-width: 500px;
      width: 100%;
    }
    .logo {
      font-family: "Segoe UI", Tahoma, sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #617525;
      margin: 0 0 28px;
    }
    .check {
      width: 44px;
      height: 44px;
      background: #e8f5e9;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 0 20px;
      font-size: 1.3rem;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      font-family: "Segoe UI", Tahoma, sans-serif;
      margin: 0 0 12px;
      color: #1e2933;
    }
    p {
      font-size: 1rem;
      line-height: 1.7;
      margin: 0 0 10px;
      color: #3a4a55;
    }
    .muted {
      font-size: 0.88rem;
      color: #637381;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="logo">Center for Food Action</p>
    <div class="check">&#10003;</div>
    <h1>You have been unsubscribed</h1>
    <p>
      You will no longer receive donation emails from CFA{% if donation.email %}
      at <strong>{{ donation.email }}</strong>{% endif %}.
    </p>
    <p class="muted">If this was a mistake, please contact us directly.</p>
  </div>
</body>
</html>
