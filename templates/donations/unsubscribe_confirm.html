<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unsubscribe &ndash; Center for Food Action</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: #f4f6f8;
      color: #1e2933;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      background: #fff;
      border: 1px solid #d7dee4;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(20,40,60,0.08);
      padding: 40px 44px;
      max-width: 500px;
      width: 100%;
    }
    .logo {
      font-family: "Segoe UI", Tahoma, sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #617525;
      margin: 0 0 28px;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      font-family: "Segoe UI", Tahoma, sans-serif;
      margin: 0 0 12px;
      color: #1e2933;
    }
    p {
      font-size: 1rem;
      line-height: 1.7;
      margin: 0 0 28px;
      color: #3a4a55;
    }
    button {
      background: #b42318;
      color: #fff;
      border: none;
      padding: 11px 26px;
      border-radius: 8px;
      font-family: "Segoe UI", Tahoma, sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover { background: #8f1b13; }
  </style>
</head>
<body>
  <div class="card">
    <p class="logo">Center for Food Action</p>
    <h1>Unsubscribe from emails</h1>
    <p>
      Hi <strong>{{ donation.donor_name|default:"there" }}</strong>,
      click below to confirm you no longer want to receive
      donation emails from CFA.
    </p>
    <form method="post">
      {% csrf_token %}
      <button type="submit">Confirm unsubscribe</button>
    </form>
  </div>
</body>
</html>
