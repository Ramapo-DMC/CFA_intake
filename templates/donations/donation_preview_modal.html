<div id="donation-preview-inner">
  <form id="donation-edit-form">
    {% csrf_token %}

    <div class="det-section">
      <div class="det-section-title">Donor Information</div>
      <div class="det-grid">
        <div class="det-field">
          <label>Date</label>
          <input type="date" name="donation_date" value="{{ donation.donation_date|date:'Y-m-d' }}" class="form-control" />
        </div>
        <div class="det-field">
          <label>Site</label>
          <input type="text" value="{{ donation.site.name }}" class="form-control" readonly />
        </div>
        <div class="det-field">
          <label>Donor Name</label>
          <input type="text" name="donor_name" value="{{ donation.donor_name }}" class="form-control" />
        </div>
        <div class="det-field">
          <label>Donor Type</label>
          <select name="donor_type" class="form-control">
            {% for value, label in donor_type_choices %}
            <option value="{{ value }}" {% if donation.donor_type == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="det-field det-span-2">
          <label>Organization</label>
          <input type="text" name="organization" value="{{ donation.organization }}" class="form-control" />
        </div>
        <div class="det-field">
          <label>Email</label>
          <input type="email" name="email" value="{{ donation.email }}" class="form-control" />
        </div>
        <div class="det-field">
          <label>Phone</label>
          <input type="tel" name="phone_number" value="{{ donation.phone_number }}" class="form-control"
                 pattern="[\+\d][\d\s()\-\.]{6,19}"
                 title="e.g. 555-123-4567 or (555) 867-5309" />
        </div>
        <div class="det-field det-span-2">
          <label>Address</label>
          <textarea name="address" class="form-control" rows="3">{{ donation.address }}</textarea>
        </div>
      </div>
    </div>

    <div class="det-section">
      <div class="det-section-title">Donation Details</div>
      <div class="det-grid-3">
        <div class="det-field">
          <label># of Bags</label>
          <input type="number" min="0" name="num_bags" value="{{ donation.num_bags }}" class="form-control" />
        </div>
        <div class="det-field">
          <label># of Boxes</label>
          <input type="number" min="0" name="num_boxes" value="{{ donation.num_boxes }}" class="form-control" />
        </div>
        <div class="det-field">
          <label>Cash / Check $</label>
          <input type="number" step="0.01" min="0" name="cash_check" value="{{ donation.cash_check }}" class="form-control" />
        </div>
        <div class="det-field">
          <label>Gift Cards $</label>
          <input type="number" step="0.01" min="0" name="gift_cards" value="{{ donation.gift_cards }}" class="form-control" />
        </div>
        <div class="det-field">
          <label>Other Donation</label>
          <input type="text" name="other_donation" value="{{ donation.other_donation }}" class="form-control" />
        </div>
        <div class="det-field">
          <label>Total Weight (lbs)</label>
          <input type="number" step="0.01" min="0" name="total_weight" value="{{ donation.total_weight }}" class="form-control" />
        </div>
        <div class="det-field det-span-3">
          <label>Items</label>
          <div id="det-items">
            {% for item in donation.items.all %}
            <div class="det-item-row">
              <input type="hidden" name="item_category" value="{{ item.category }}">
              <span class="det-item-label">{{ item.get_category_display }}</span>
              <input type="number" step="0.01" min="0" name="item_quantity"
                     value="{{ item.quantity|floatformat:'-2' }}" class="form-control det-item-qty">
              <span class="det-item-unit">{{ item.unit }}</span>
              <button type="button" class="det-item-remove" aria-label="Remove item">&times;</button>
            </div>
            {% endfor %}
          </div>
          <div class="det-item-add">
            <select id="det-item-cat" class="form-control">
              <option value="">Add an item…</option>
              {% for key, label in category_choices %}
              <option value="{{ key }}">{{ label }}</option>
              {% endfor %}
            </select>
            <input type="number" step="0.01" min="0" id="det-item-qty" class="form-control"
                   placeholder="Qty" disabled>
            <button type="button" class="det-btn det-btn-secondary" id="det-item-add-btn" disabled>Add</button>
          </div>
        </div>
      </div>
      <div class="det-field">
        <label>Notes</label>
        <textarea name="notes" class="form-control" rows="3"
          placeholder="Add details such as item condition, quantity notes, or handling instructions.">{{ donation.notes }}</textarea>
      </div>
    </div>
  </form>

  <div id="preview-save-error" class="det-error" style="display:none;"></div>

  <div class="det-actions">
    <button type="button" class="det-btn det-btn-danger" id="delete-donation-btn">Delete Donation</button>
    <div class="det-actions-right">
      <button type="button" class="det-btn det-btn-primary" id="save-donation-btn">Save Changes</button>
      <button type="button" class="det-btn det-btn-secondary" onclick="closePreviewModal()">Close</button>
    </div>
  </div>
</div>

{{ catalog_json|json_script:"prev-catalog" }}

<script>
(function () {
    /* ── Line item add / remove ─────────────────────────────
       Rows live inside the form, so FormData picks up their
       item_category / item_quantity pairs with no extra work. The
       hidden category always precedes its quantity in document order,
       which is what pairs them up server-side. */
    const CATALOG = JSON.parse(document.getElementById('prev-catalog').textContent);
    const itemsBox  = document.getElementById('det-items');
    const itemCat   = document.getElementById('det-item-cat');
    const itemQty   = document.getElementById('det-item-qty');
    const itemAdd   = document.getElementById('det-item-add-btn');

    function syncAddRow() {
        const on = !!itemCat.value;
        itemQty.disabled = !on;
        itemAdd.disabled = !on;
        itemQty.placeholder = on ? (CATALOG[itemCat.value].unit) : 'Qty';
    }
    itemCat.addEventListener('change', syncAddRow);
    syncAddRow();

    itemAdd.addEventListener('click', function () {
        const key = itemCat.value;
        const q = parseFloat(itemQty.value);
        if (!key || isNaN(q) || q <= 0) return;
        const entry = CATALOG[key];

        const row = document.createElement('div');
        row.className = 'det-item-row';
        row.innerHTML =
            '<input type="hidden" name="item_category">' +
            '<span class="det-item-label"></span>' +
            '<input type="number" step="0.01" min="0" name="item_quantity" class="form-control det-item-qty">' +
            '<span class="det-item-unit"></span>' +
            '<button type="button" class="det-item-remove" aria-label="Remove item">&times;</button>';
        row.querySelector('[name=item_category]').value = key;
        row.querySelector('.det-item-label').textContent = entry.label;
        row.querySelector('[name=item_quantity]').value = String(q);
        row.querySelector('.det-item-unit').textContent = entry.unit;
        itemsBox.appendChild(row);

        itemCat.value = ''; itemQty.value = ''; syncAddRow();
        
    });

    itemsBox.addEventListener('click', function (e) {
        const btn = e.target.closest('.det-item-remove');
        if (!btn) return;
        btn.closest('.det-item-row').remove();
        
    });
    itemsBox.addEventListener('input', function (e) {
        if (e.target.name === 'item_quantity') {  }
    });

    function getCsrf() {
        const el = document.querySelector('#donation-edit-form [name=csrfmiddlewaretoken]');
        return el ? el.value : '';
    }

    document.getElementById('save-donation-btn').onclick = function () {
        const form = document.getElementById('donation-edit-form');
        const data = new FormData(form);
        const errBox = document.getElementById('preview-save-error');
        errBox.style.display = 'none';
        fetch('{% url "donation-edit" donation.pk %}', {
            method: 'POST',
            headers: { 'X-CSRFToken': getCsrf() },
            body: data
        })
        .then(r => r.json())
        .then(resp => {
            if (resp.success) {
                closePreviewModal();
                window.location.reload();
            } else {
                const msgs = Object.values(resp.errors || {}).flat().join(' ');
                errBox.textContent = msgs || 'Failed to save.';
                errBox.style.display = 'block';
            }
        })
        .catch(() => {
            errBox.textContent = 'Network error. Please try again.';
            errBox.style.display = 'block';
        });
    };

    document.getElementById('delete-donation-btn').onclick = function () {
        if (!confirm('Delete this donation? This cannot be undone.')) return;
        fetch('{% url "donation-delete" donation.pk %}', {
            method: 'POST',
            headers: { 'X-CSRFToken': getCsrf() }
        })
        .then(r => r.json())
        .then(resp => {
            if (resp.success) {
                closePreviewModal();
                window.location.reload();
            } else {
                alert('Failed to delete.');
            }
        });
    };
})();
</script>
